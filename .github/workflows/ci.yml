name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r nova_os/requirements.txt
          pip install pytest pytest-asyncio flake8 black
      
      - name: Lint
        run: |
          flake8 nova_os/ --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check nova_os/
      
      - name: Test
        run: pytest tests/ -v || echo "No tests yet"

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: docker build -t nova-os:test .
      
      - name: Test Docker image
        run: docker run --rm nova-os:test status

  release:
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            mamun/nova-os:latest
            mamun/nova-os:${{ github.ref_name }}
      
      - name: Create release archive
        run: |
          tar -czf nova-os.tar.gz nova_os/ install/ README.md Dockerfile
      
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./nova-os.tar.gz
          asset_name: nova-os.tar.gz
          asset_content_type: application/gzip